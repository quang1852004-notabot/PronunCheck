name: Auto Deploy Backend to GCP VM

on:
  push:
    branches: [ "main" ]

jobs:
  deploy-backend:
    name: Deploy Python AI Backend to GCP VM
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Backend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            echo "--- [1/3] Đang kéo code mới nhất từ Git ---"
            cd /home/quang18_5_2004/PronunCheck
            git fetch origin main
            git reset --hard origin/main
            
            echo "--- [2/3] Cài đặt & cập nhật dependencies Backend ---"
            source venv/bin/activate
            pip install -r requirements.txt
            
            echo "--- [3/3] Khởi động lại service Backend (FastAPI / AI) ---"
            sudo systemctl restart pronuncheck-backend
            sudo systemctl status pronuncheck-backend --no-pager
            
            echo "=== BACKEND DEPLOYED & RESTARTED SUCCESSFULLY ==="